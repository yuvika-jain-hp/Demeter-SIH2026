name: demeter_vle_hub
description: Demeter Platform — Stage 2 VLE Hub. BLE scale + AgriStack + Wi-Fi Direct offline tunnel.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE hardware integration
  flutter_blue_plus: ^1.35.0

  # Nearby Connections (Wi-Fi Direct fallback)
  nearby_connections: ^4.0.0

  # HTTP networking
  dio: ^5.7.0
  permission_handler: ^13.0.2
  sqflite: ^2.4.4
  workmanager: ^0.10.10
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
